- hosts: staging
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
    mysql_root_password: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}"
    phpmyadmin_app_password: "{{ lookup('env','PHPMYADMIN_APP_PASSWORD') }}"

  tasks:
    #  Update server packages
    - name: Update server packages
      apt:
        update_cache: yes
        upgrade: yes

    #  Install Apache
    - name: Install Apache
      apt:
        name: apache2
        state: present

    #  Install PHP
    - name: Install PHP
      apt:
        name: php
        state: present

    #  Install Python MySQL module for Ansible
    - name: Install Python MySQL module
      apt:
        name: python3-pymysql
        state: present

    #  Preseed MySQL root password (first install only)
    - name: Set MySQL root password before installation
      debconf:
        name: mysql-server
        question: "mysql-server/root_password"
        value: "{{ mysql_root_password }}"
        vtype: "password"

    - name: Confirm MySQL root password
      debconf:
        name: mysql-server
        question: "mysql-server/root_password_again"
        value: "{{ mysql_root_password }}"
        vtype: "password"

    #  Install MySQL Server
    - name: Install MySQL Server
      apt:
        name: mysql-server
        state: present

    #  PhpMyAdmin installation
    - name: Preseed phpMyAdmin
      debconf:
        name: phpmyadmin
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: "phpmyadmin/dbconfig-install", value: "true", vtype: "boolean" }
        - { question: "phpmyadmin/app-password-confirm", value: "{{ phpmyadmin_app_password }}", vtype: "password" }
        - { question: "phpmyadmin/mysql/admin-pass", value: "{{ mysql_root_password }}", vtype: "password" }
        - { question: "phpmyadmin/mysql/app-pass", value: "{{ phpmyadmin_app_password }}", vtype: "password" }
        - { question: "phpmyadmin/reconfigure-webserver", value: "apache2", vtype: "string" }

    - name: Install phpMyAdmin package
      apt:
        name: phpmyadmin
        state: present

    - name: Sync project to server
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /var/www/html/
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=ansible"
          - "--exclude=.github"
