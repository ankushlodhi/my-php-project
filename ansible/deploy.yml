- hosts: staging
  become: yes
  tasks:

    - name: Update server packages
      apt:
        update_cache: yes

    - name: Install Apache
      apt:
        name: apache2
        state: present
        
    - name: Install PHP
      apt:
        name: php
        state: present

    # Ensure pymysql installed BEFORE mysql_user & mysql_query
    - name: Install Python MySQL module for Ansible
      apt:
        name: python3-pymysql
        state: present

    # Pre-seed MySQL password only useful on first install
    - name: Set MySQL root password before installation
      debconf:
        name: mysql-server
        question: "mysql-server/root_password"
        value: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}"
        vtype: "password"

    - name: Confirm MySQL root password
      debconf:
        name: mysql-server
        question: "mysql-server/root_password_again"
        value: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}"
        vtype: "password"

    - name: Install MySQL Server
      apt:
        name: mysql-server
        state: present

    # Fix for existing MySQL installation
    - name: Set MySQL root password even if MySQL is already installed
      mysql_user:
        login_user: root
        login_password: ""
        name: root
        host_all: true
        password: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}"
        plugin: mysql_native_password
        check_implicit_admin: true

    - name: Flush MySQL privileges
      mysql_query:
        query: "FLUSH PRIVILEGES;"
        login_user: root
        login_password: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}"
        check_implicit_admin: true

    # phpMyAdmin installation
    - name: Preseed phpMyAdmin
      debconf:
        name: phpmyadmin
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: "phpmyadmin/dbconfig-install", value: "true", vtype: "boolean" }
        - { question: "phpmyadmin/app-password-confirm", value: "{{ lookup('env','PHPMYADMIN_APP_PASSWORD') }}", vtype: "password" }
        - { question: "phpmyadmin/mysql/admin-pass", value: "{{ lookup('env','MYSQL_ROOT_PASSWORD') }}", vtype: "password" }
        - { question: "phpmyadmin/mysql/app-pass", value: "{{ lookup('env','PHPMYADMIN_APP_PASSWORD') }}", vtype: "password" }
        - { question: "phpmyadmin/reconfigure-webserver", value: "apache2", vtype: "string" }

    - name: Install phpMyAdmin package
      apt:
        name: phpmyadmin
        state: present

    # Apache config symlink (important)
    - name: Enable phpMyAdmin in Apache
      file:
        src: /etc/phpmyadmin/apache.conf
        dest: /etc/apache2/conf-enabled/phpmyadmin.conf
        state: link

    - name: Restart Apache
      systemd:
        name: apache2
        state: restarted

    - name: Sync project to server
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: /var/www/html/
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=ansible"
          - "--exclude=.github"
